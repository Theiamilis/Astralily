<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lily Live2D Stage</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      html {
        overscroll-behavior-x: none;
        touch-action: none;
      }

      body {
        display: flex;
        flex-wrap: wrap;
        background: transparent;
      }

      body > canvas:only-child {
        width: 100vw;
        height: 100vh;
        background: transparent;
      }
    </style>
    <script src="/live2d/live2dcubismcore.min.js"></script>
    <script src="/src/live2d-stage/main.ts" type="module"></script>
  </head>
  <body></body>
</html>
