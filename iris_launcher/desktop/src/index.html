<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRIS Launcher</title>
    <style>
      :root { color-scheme: dark; font-family: 'Trebuchet MS', sans-serif; background: #11110f; color: #f4f0e5; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #30212a 0, #11110f 58%); }
      main { width: min(520px, 80vw); text-align: center; letter-spacing: .04em; }
      b { display: grid; place-items: center; width: 82px; height: 82px; margin: 0 auto 28px; border: 1px solid #ff4f9a; border-radius: 50%; color: #ff4f9a; font: 48px Georgia, serif; }
      h1 { font: 32px Georgia, serif; font-weight: normal; }
      p { margin: 0; color: #aaa49a; font-size: 14px; line-height: 1.7; }
    </style>
  </head>
  <body><main><b>I</b><h1 id="startup-title">Waking the constellation.</h1><p id="startup-message">Connecting to your local launcher. No Lily services are started until you ask.</p></main></body>
</html>
